plugins {
    id 'com.android.application'
}

android {
    namespace 'net.cleanhome.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'net.cleanhome.launcher'
        // minSdk comes from gradle.properties or -PminSdk=<n> (build-and-install.sh passes the TV's level).
        minSdk Integer.parseInt(project.findProperty('minSdk').toString())
        // Google TV 14 sets refuse installs that target very old SDKs; keep this recent.
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // A release build is optional; the debug build is what the scripts install.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}
